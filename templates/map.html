<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-light">
  <main class="container-fluid">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h2 class="mb-0">Recommended Locations</h2>
      <a href="/" class="btn btn-secondary">Back</a>
    </div>

    <div class="row g-4 align-items-start">
      <section class="col-lg-8">
        <div class="bg-white border rounded shadow-sm overflow-hidden">
          {{ map|safe }}
        </div>
      </section>

      <aside class="col-lg-4">
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-dark text-white">
            Prediction Results
          </div>

          <ul class="list-group list-group-flush">
            {% for lat, lon in stations %}
              <li class="list-group-item">
                <strong>Lat:</strong> {{ lat|round(4) }}
                <span class="text-muted">|</span>
                <strong>Lon:</strong> {{ lon|round(4) }}
              </li>
            {% endfor %}
          </ul>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Next Step</h5>
            <p class="text-muted mb-3">
              Use these recommended points as the result of the map prediction.
            </p>
            <a href="/regression" class="btn btn-primary w-100">Go to Energy Predict</a>
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
