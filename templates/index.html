<!DOCTYPE html>
<html>
<head>
<title>Optimizador EV Colombia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/
bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Configuración del Sistema de Recomendación</h2>
<form action="/recomendar" method="post" class="card p-4 shadow-sm">
<label class="form-label">Número de estaciones a instalar:</label>
<input type="number" name="n_estaciones" class="form-control" value="5" min="1"
max="20">

<button type="submit" class="btn btn-primary mt-3">Calcular Ubicaciones
Óptimas</button>
</form>
<a href="/" class="btn btn-secondary mt-3">Volver</a>
</body>
</html>
